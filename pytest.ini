[pytest]
testpaths = tests
addopts = -ra --strict-markers
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
markers =
    api: API tests
    ui: UI tests (Playwright)
    xdist_group: keep tests of one group on one worker (pytest-xdist --dist loadgroup)
