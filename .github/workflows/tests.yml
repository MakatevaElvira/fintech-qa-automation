name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1-5"   # UI regression on weekdays
  workflow_dispatch:
    inputs:
      workers:
        description: "Number of parallel workers"
        type: choice
        options: ["1", "2", "4"]
        default: "2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check . && uvx ruff format --check .

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run playwright install --with-deps chrome

      - name: Preflight - service starts and answers /health
        run: |
          uv run python -m app.server --port 8080 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8080/health && exit 0; sleep 0.5; done
          echo "service did not start"; exit 1

      - name: Run tests
        run: |
          uv run pytest -n ${{ inputs.workers || '2' }} --dist loadgroup \
            --alluredir=allure-results --html=report.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            allure-results
            report.html
            test-results
